<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Até aqui não havia ícone nenhum: o navegador desenhava a folha em branco
      padrão. Numa ferramenta de trabalho, que fica aberta ao lado de e-mail e
      planilha, a aba sem ícone é a mais difícil de reencontrar.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS pinta de preto o que for transparente; este vai com fundo branco. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Barra do navegador no celular com a cor do cabeçalho, para a tela não
         terminar numa faixa cinza acima da barra azul. -->
    <meta name="theme-color" content="#1f3864" />

    <title>Conserva Predial — Sistema de Manutenção</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
