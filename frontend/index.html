<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Até aqui não havia ícone nenhum: o navegador desenhava a folha em branco
      padrão. Numa ferramenta de trabalho, que fica aberta ao lado de e-mail e
      planilha, a aba sem ícone é a mais difícil de reencontrar.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS pinta de preto o que for transparente; este vai com fundo branco. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Instalável no celular (tela inicial, sem barra do navegador) e
         utilizável sem conexão para consultar a fila: ver public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Barra do navegador no celular com a cor do cabeçalho, para a tela não
         terminar numa faixa cinza acima da barra azul. -->
    <meta name="theme-color" content="#1f3864" />

    <!--
      Descrição da página (o texto troca a cada rota: ver AnuncioDeRota) e pedido
      de que nenhuma tela entre em índice de busca. É um sistema de uso interno:
      o que há aqui é dado da instituição. O `noindex` vale também por cabeçalho
      (X-Robots-Tag, em vercel.json) e é um pedido a robôs que o respeitam, não
      controle de acesso: quem controla o acesso é o login.
    -->
    <meta
      name="description"
      content="Conserva Predial: sistema de pedidos e acompanhamento de manutenção predial."
    />
    <meta name="robots" content="noindex, nofollow" />

    <title>Conserva Predial — Sistema de Manutenção</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      O Conserva Predial precisa de JavaScript para funcionar. Ative-o no navegador e recarregue a
      página.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
