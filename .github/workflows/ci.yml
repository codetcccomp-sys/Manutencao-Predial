name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest

    # Node 22 e 24: os projetos da Vercel rodam 24.x, e antes só a 22 era testada, ou
    # seja, o que ia ao ar rodava numa versão em que nenhum teste tinha rodado.
    # `backend/tests/versaoDoNode.test.js` impede que um dos dois saia da lista.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # O mesmo aplicador de migrações usado em produção, para que o banco
      # dos testes seja construído pelo caminho que precisa funcionar de verdade.
      - name: Aplicar migrações
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smp_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run migrate

      # DATABASE_URL não é usada aqui de propósito: esse caminho do db.js força
      # SSL (para o pooler do Supabase) e o Postgres do runner não atende SSL.
      - name: Testes
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smp_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: segredo_de_teste_ci
          JWT_EXPIRES_IN: 1h
        run: npm test -- --runInBand

  frontend:
    name: Frontend (build e testes)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Os testes de componente rodam em jsdom: sem banco, sem servidor, em
      # segundos. É a rede fina que pega a maior parte das regressões de
      # comportamento antes de acordar o navegador.
      - name: Testes de componente
        working-directory: frontend
        run: npm test

      - run: npm run build
        working-directory: frontend

  e2e:
    name: Frontend (ponta a ponta)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: smp_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: segredo_de_teste_e2e
      JWT_EXPIRES_IN: 1h
      CRON_SECRET: segredo_de_agendador_e2e
      E2E_ADMIN_EMAIL: admin_e2e@exemplo.com
      E2E_ADMIN_SENHA: senha_de_teste_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      # O mesmo aplicador de migrações de produção, pelo mesmo motivo do job
      # do backend: o banco do teste precisa nascer do caminho que funciona.
      - name: Aplicar migrações
        working-directory: backend
        run: npm run migrate

      # O cadastro público só cria solicitante (RN01). Este é o único degrau
      # que a API não oferece, e o script recusa rodar com NODE_ENV=production.
      - name: Semear administrador de teste
        working-directory: backend
        run: node database/semear-admin.js

      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # O playwright.config.js sobe o backend e o `vite preview` sozinho: o
      # teste roda contra a build, que é o que vai para produção.
      - name: Testes de ponta a ponta
        working-directory: frontend
        run: npm run e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
