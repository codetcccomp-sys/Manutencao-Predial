name: Auditoria de dependências

# Separada do CI de propósito. Advisory novo aparece sem que ninguém tenha mexido
# no código: dentro do ci.yml, ele deixaria vermelha qualquer PR sem relação com
# a falha. Aqui ela roda só quando uma dependência muda, e uma vez por semana
# para pegar o que foi publicado depois.
on:
  pull_request:
    paths:
      - 'backend/package*.json'
      - 'frontend/package*.json'
      - '.github/workflows/auditoria.yml'
  push:
    branches: [main]
    paths:
      - 'backend/package*.json'
      - 'frontend/package*.json'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    name: npm audit (${{ matrix.pacote }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pacote: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Só o que vai para produção (--omit=dev), e só severidade alta ou crítica:
      # ferramenta de build e achado moderado em código que o sistema não usa
      # (um problema de SSR do react-router, numa SPA) transformariam o aviso em
      # ruído que se aprende a ignorar. O preço é que o moderado relevante também
      # passa: o open redirect do react-router 6 só foi corrigido (subindo para a
      # 7) porque uma revisão o procurou. O mesmo vale para pacote descontinuado
      # — o multer 1.x não acusava nada aqui. O audit lê o package-lock.json; não
      # precisa instalar nada.
      - name: npm audit
        working-directory: ${{ matrix.pacote }}
        run: npm audit --omit=dev --audit-level=high
