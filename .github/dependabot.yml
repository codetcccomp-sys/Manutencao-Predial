# Atualizações de dependência, abertas como PR para o CI julgar.
#
# Patch e minor andam juntos num PR por ecossistema por semana: o volume fica
# revisável, e o CI (356+ testes no backend, 185 de tela, e2e) é quem diz se
# quebrou. Versão maior sai separada, de propósito: é onde mora a mudança
# incompatível, e merece ser lida sozinha.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(backend)'
    groups:
      backend-minor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(frontend)'
    groups:
      frontend-minor-e-patch:
        update-types: [minor, patch]
    # O Playwright 1.65 traz o Firefox 159, e com ele a aba Materiais de Cadastros trava o
    # navegador durante a análise do axe ("Page crashed", e2e/materiais.spec.js), em duas rodadas do
    # PR #110. As mesmas atualizações com o Playwright 1.64 passaram no Firefox (PR #111,
    # 16/11/2026). Só a 1.65 fica de fora: a próxima versão volta a ser proposta, e o CI a julga.
    ignore:
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
